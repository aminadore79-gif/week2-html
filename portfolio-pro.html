<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 증강 React 포트폴리오</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 🎨 전체 디자인 (CSS-in-JS 대신 깔끔하게 분리) */
        body { font-family: 'Arial', sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; color: #333; }
        
        /* 🌟 네비게이션 바 (메뉴) */
        .navbar { background-color: #2c3e50; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .nav-brand { font-size: 24px; font-weight: bold; }
        .nav-links button { background: none; border: none; color: white; margin-left: 20px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; padding-bottom: 5px; }
        .nav-links button:hover { color: #00d8d6; }
        .nav-links button.active { color: #00d8d6; border-bottom: 2px solid #00d8d6; }

        /* 📄 페이지 컨테이너 */
        .page-container { max-width: 800px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 🤖 AI 챗봇 디자인 */
        .chatbot-widget { position: fixed; bottom: 30px; right: 30px; z-index: 1000; font-family: sans-serif; }
        .chat-toggle-btn { background-color: #9b59b6; color: white; border: none; padding: 15px 25px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4); transition: 0.3s; }
        .chat-toggle-btn:hover { transform: scale(1.05); }
        .chat-window { width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ddd; margin-top: 15px; }
        .chat-header { background-color: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .chat-header button { background: none; border: none; color: white; cursor: pointer; font-size: 18px; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; background-color: #f4f6f9; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 15px; max-width: 75%; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg.user { background-color: #3498db; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg.ai { background-color: white; color: #333; border: 1px solid #ddd; align-self: flex-start; border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chat-input { display: flex; border-top: 1px solid #eee; background: white; padding: 10px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        .chat-input button { background-color: #2c3e50; color: white; border: none; padding: 0 15px; margin-left: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 🧱 1. 각각의 페이지 부품(컴포넌트) 만들기
        // ==========================================
        function Home() {
            return (
                <div style={{textAlign: 'center'}}>
                    <h1 style={{fontSize: '36px', color: '#2c3e50'}}>🚀 SPA 세계에 오신 것을 환영합니다!</h1>
                    <p style={{fontSize: '18px', color: '#7f8c8d', lineHeight: '1.6'}}>
                        이곳은 React로 만들어진 Single Page Application(SPA)입니다.<br/>
                        메뉴를 클릭해 보세요. 화면이 깜빡이지 않고 부드럽게 바뀔 겁니다!
                    </p>
                    <img src="https://via.placeholder.com/400x200?text=My+Portfolio" alt="대문 이미지" style={{borderRadius: '15px', marginTop: '20px', width: '100%', maxWidth: '400px'}} />
                </div>
            );
        }

        function About() {
            return (
                <div>
                    <h2 style={{color: '#2c3e50'}}>👨‍💻 About Me</h2>
                    <hr />
                    <p>안녕하세요! 10일 만에 React SPA와 AI 통신까지 마스터한 풀스택 개발자입니다.</p>
                    <ul>
                        <li>✨ 프론트엔드: HTML, CSS, JS, <b>React</b></li>
                        <li>🤖 AI: Gemini API, Prompt Engineering</li>
                    </ul>
                </div>
            );
        }

        function Projects() {
            return (
                <div>
                    <h2 style={{color: '#2c3e50'}}>🎨 My Projects</h2>
                    <hr />
                    <div style={{display: 'flex', gap: '15px', flexWrap: 'wrap'}}>
                        <div style={{flex: '1', minWidth: '200px', border: '1px solid #ddd', padding: '15px', borderRadius: '10px'}}>
                            <h3>🍅 뽀모도로 타이머</h3>
                            <p>바닐라 JS를 활용한 시간 관리 앱</p>
                        </div>
                        <div style={{flex: '1', minWidth: '200px', border: '1px solid #ddd', padding: '15px', borderRadius: '10px'}}>
                            <h3>📊 3D 레이더 차트</h3>
                            <p>Chart.js와 Three.js를 활용한 시각화</p>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 🤖 2. 진짜 AI 통신이 가능한 챗봇 부품 (핵심!)
        // ==========================================
        function AIChatbot() {
            const [isOpen, setIsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([
                { sender: 'ai', text: "안녕하세요! 제 포트폴리오에 대해 무엇이든 물어보세요. (예: 어떤 기술을 다루시나요?)" }
            ]);
            const [input, setInput] = React.useState("");
            const [isLoading, setIsLoading] = React.useState(false);

            // 🌟 아래에 발급받은 실제 Gemini API 키를 넣으면 진짜 AI가 됩니다!
            const API_KEY = "여기에_진짜_API_키를_넣으세요"; 

            
// [수정된 sendMessage 함수] 가짜 AI 비서 로직
            const sendMessage = () => {
                if (!input.trim()) return;
                
                // 1. 내 메시지를 채팅창에 추가
                const newMessages = [...messages, { sender: 'user', text: input }];
                setMessages(newMessages);
                const currentInput = input; // 입력값 백업
                setInput("");
                setIsLoading(true);

                // 2. 가짜 통신 (1초 동안 진짜 AI가 생각하는 척 딜레이 주기!)
                setTimeout(() => {
                    let aiReply = "앗, 그 질문은 아직 배우지 못했어요! 😅 '기술', '목표', '연락' 중 하나를 포함해서 물어봐주세요.";
                    
                    // 키워드에 따라 대답을 다르게 설정!
                    if (currentInput.includes("안녕")) {
                        aiReply = "안녕하세요! 포트폴리오 AI 비서입니다! 만나서 반가워요 👋";
                    } else if (currentInput.includes("기술") || currentInput.includes("스택")) {
                        aiReply = "저는 HTML, CSS, JavaScript, 그리고 최신 무기인 React까지 다룰 줄 아는 풀스택 유망주입니다! 💻";
                    } else if (currentInput.includes("목표") || currentInput.includes("비전")) {
                        aiReply = "사내 방화벽도 뚫어버리는(?) 최고의 AI 증강 풀스택 개발자가 되는 것이 목표입니다! 🚀";
                    } else if (currentInput.includes("연락") || currentInput.includes("이메일")) {
                        aiReply = "제게 관심이 있으시군요! aminadore79@gmail.com 으로 연락주시면 감사하겠습니다! 📧";
                    }

                    // AI의 대답을 채팅창에 업데이트!
                    setMessages([...newMessages, { sender: 'ai', text: aiReply }]);
                    setIsLoading(false);
                }, 1000); // 1000ms = 1초 기다림
            };

            return (
                <div className="chatbot-widget">
                    {!isOpen && (
                        <button className="chat-toggle-btn" onClick={() => setIsOpen(true)}>💬 AI 비서 호출</button>
                    )}
                    
                    {isOpen && (
                        <div className="chat-window">
                            <div className="chat-header">
                                <span>🤖 포트폴리오 비서</span>
                                <button onClick={() => setIsOpen(false)}>✖</button>
                            </div>
                            <div className="chat-body">
                                {messages.map((msg, index) => (
                                    <div key={index} className={`msg ${msg.sender}`}>
                                        {msg.text}
                                    </div>
                                ))}
                                {isLoading && <div className="msg ai">타이핑 중... ✍️</div>}
                            </div>
                            <div className="chat-input">
                                <input 
                                    type="text" 
                                    placeholder="질문을 입력하세요..." 
                                    value={input} 
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                />
                                <button onClick={sendMessage}>전송</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 👑 3. 메인 앱 (모든 부품을 조립하는 공장)
        // ==========================================
        function App() {
            // 🧠 어떤 페이지를 보여줄지 결정하는 상태 (기본값: 'home')
            const [activeTab, setActiveTab] = React.useState('home');

            return (
                <div>
                    {/* 상단 네비게이션 바 */}
                    <nav className="navbar">
                        <div className="nav-brand">🚀 My Portfolio</div>
                        <div className="nav-links">
                            <button className={activeTab === 'home' ? 'active' : ''} onClick={() => setActiveTab('home')}>Home</button>
                            <button className={activeTab === 'about' ? 'active' : ''} onClick={() => setActiveTab('about')}>About</button>
                            <button className={activeTab === 'projects' ? 'active' : ''} onClick={() => setActiveTab('projects')}>Projects</button>
                        </div>
                    </nav>

                    {/* ✨ 마법의 라우팅: activeTab의 값에 따라 다른 컴포넌트를 보여줍니다! */}
                    <div className="page-container">
                        {activeTab === 'home' && <Home />}
                        {activeTab === 'about' && <About />}
                        {activeTab === 'projects' && <Projects />}
                    </div>

                    {/* AI 챗봇은 페이지가 바뀌어도 항상 오른쪽 아래에 떠있습니다! */}
                    <AIChatbot />
                </div>
            );
        }

        // 4. 화면에 렌더링
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
